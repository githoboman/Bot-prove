name: formal-verification

on:
  push:
    branches: [main, post-hackathon/roadmap]
    paths:
      - 'specs/**'
      - '.github/workflows/formal-verification.yml'
  pull_request:
    paths:
      - 'specs/**'
      - '.github/workflows/formal-verification.yml'
  workflow_dispatch:

concurrency:
  group: formal-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC model check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v4
        with:
          path: ~/tla2tools.jar
          key: tla2tools-v1.8.0

      - name: Download tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -o "$HOME/tla2tools.jar"

      - name: Run TLC on every spec
        env:
          TLA_TOOLS_JAR: /home/runner/tla2tools.jar
          TLC_TIMEOUT: '1500'
        run: |
          chmod +x specs/run-tlc.sh
          bash specs/run-tlc.sh

      - name: Upload TLC traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-traces
          path: |
            specs/*_TTrace_*.tla
            specs/states/
          if-no-files-found: ignore
          retention-days: 7
