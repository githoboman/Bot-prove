version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    errcheck:
      check-type-assertions: true
      # These stdlib Close() calls are always safe to ignore per Go convention.
      exclude-functions:
        - (*net/http.Response).Body.Close
        - (io.Closer).Close
