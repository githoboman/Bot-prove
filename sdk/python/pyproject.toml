[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "botprove"
version = "0.1.2"
description = "BotProve Python SDK — prove, verify, batch, anchor with client-side receipt validation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BotProve", email = "anna.stolbovskaja@gmail.com" }]
keywords = ["botprove", "zk", "groth16", "attestation", "bot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/anna-stolbovskaja/BotProve"
Repository = "https://github.com/anna-stolbovskaja/BotProve"
Issues = "https://github.com/anna-stolbovskaja/BotProve/issues"

[tool.hatch.build.targets.wheel]
packages = ["botprove"]

[tool.hatch.build.targets.sdist]
include = [
  "botprove/**/*.py",
  "README.md",
  "pyproject.toml",
]
exclude = [
  "botprove/tests/**",
  "**/__pycache__",
]
