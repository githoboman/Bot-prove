\* TLC configuration for the small finite model.
\* Kept intentionally tiny so a full state-space search fits in seconds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Provers = {p1, p2}
    Models  = {m1, m2}
    MaxProofs = 3
    MaxChainDepth = 2
    ChallengeWindow = 2

INVARIANTS
    TypeOK
    PQSignatureValidity
    ModelBinding
    ChainContinuity
    ChainStepsAreValid
    ProofIdUnique
    ChainIdUnique
    ChallengeWindowRespected
    RejectionBlocks
    AbstainNeutrality
    SlashedProversHaveEvidence
    SafetyInvariant
