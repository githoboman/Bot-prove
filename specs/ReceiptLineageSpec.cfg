\* TLC configuration for the receipt-lineage DAG spec.
\* Small finite model: at most 4 receipts, at most 2 parents each.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    MaxReceipts = 4
    MaxParents  = 2

INVARIANTS
    TypeOK
    AllParentsExist
    NoSelfParent
    AcyclicByEmission
    AncestorsBounded
    SafetyInvariant
