\* TLC configuration for the quorum registry spec.
\* Small finite model — 3 signer ids, up to 2 accepted witnesses.
\* Kept small to fit inside the CI budget; the exhaustive checks are
\* representative because Threshold(n) = floor(2n/3)+1 gets exercised
\* across n \in {0,1,2,3}.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Signers     = {s1, s2, s3}
    MaxAccepted = 2

INVARIANTS
    TypeOK
    StateInvariant
    WitnessBudget
    MonotonicSlashing
    RetireIsClean
    AcceptedWitnessImpliesByzantineMajority
    SafetyInvariant
